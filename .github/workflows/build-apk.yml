
name: Build Game Space Nova

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar estrutura do projeto
        run: |
          echo "Diretório atual:"
          pwd
          echo "Arquivos na raiz:"
          ls -la

          if [ ! -f "settings.gradle" ] &&
             [ ! -f "settings.gradle.kts" ]; then
            echo "::error::Não encontrei settings.gradle ou settings.gradle.kts na raiz do repositório."
            exit 1
          fi

          if [ ! -f "app/build.gradle" ] &&
             [ ! -f "app/build.gradle.kts" ]; then
            echo "::error::Não encontrei o arquivo Gradle do módulo app."
            exit 1
          fi

      - name: Compilar APK de depuração
        run: gradle --no-daemon assembleDebug

      - name: Publicar APK gerado
        uses: actions/upload-artifact@v4
        with:
          name: GameSpaceNova-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
